[project]
name = "ttt"
version = "0.1.0"
description = "End-to-end test-time training in a block masked-diffusion language model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0.0",
    "einops>=0.8.2",
    "equinox>=0.13.8",
    "google-cloud-storage>=2.19",
    "huggingface-hub[cli]>=1.14.0",
    "jaxtyping>=0.3.9",
    "jinja2>=3.1.6",
    "optax>=0.2.8",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
    "wandb>=0.26.1",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
# Exactly one: `uv sync --extra tpu` on a Cloud TPU VM, `uv sync --extra cuda` on GH200 or H100 (CUDA 13).
# jax is pinned to the version every result so far was produced with.
tpu = ["jax[tpu]==0.11.2", "tpu-info>=0.14.2"]
cuda = ["jax[cuda13]==0.11.2"]

[tool.uv]
find-links = ["https://storage.googleapis.com/jax-releases/libtpu_releases.html"]
conflicts = [[{ extra = "tpu" }, { extra = "cuda" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "xprof>=2.23.1",
]

[tool.hatch.build.targets.wheel]
# `import ttt` / `python -m ttt.train` everywhere, without PYTHONPATH tricks.
packages = ["src/ttt"]
